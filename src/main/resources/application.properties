spring.application.name=gateway
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
platform.jwt-secret=${JWT_SECRET:change-me-in-development-use-a-long-random-secret}
spring.cloud.gateway.mvc.routes[0].id=auth
spring.cloud.gateway.mvc.routes[0].uri=${AUTH_URL:http://auth:8080}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.mvc.routes[1].id=account
spring.cloud.gateway.mvc.routes[1].uri=${ACCOUNT_URL:http://account:8080}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/accounts/**
spring.cloud.gateway.mvc.routes[2].id=order
spring.cloud.gateway.mvc.routes[2].uri=${ORDER_URL:http://order:8080}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/orders/**
spring.cloud.gateway.mvc.routes[3].id=product
spring.cloud.gateway.mvc.routes[3].uri=${PRODUCT_URL:http://product:8080}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/products/**
spring.cloud.gateway.mvc.routes[4].id=exchange
spring.cloud.gateway.mvc.routes[4].uri=${EXCHANGE_URL:http://exchange:8080}
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/exchange/**
